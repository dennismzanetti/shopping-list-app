name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write build metadata
        run: |
          printf '{"sha":"%s","commitUrl":"%s","buildNumber":"%s","runId":"%s","repo":"%s"}\n' \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            "${{ github.run_number }}" \
            "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}" \
            > version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4